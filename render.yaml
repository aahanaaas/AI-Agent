services:
  - type: web
    name: dependency-doctor-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SERPAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
