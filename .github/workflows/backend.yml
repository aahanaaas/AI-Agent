name: Backend checks

on:
  push:
    paths:
      - "backend.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q backend.py smoke_test.py tests
      - run: python -m unittest discover -s tests -v
